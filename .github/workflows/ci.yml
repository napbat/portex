name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (default features)
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Build (no_std + alloc)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Check fuzz targets
        if: matrix.target == 'x86_64-pc-windows-msvc'
        # Bash stops at the first failed command. PowerShell checks only the last one.
        shell: bash
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Build fuzz targets (cargo-fuzz, nightly)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        # A fuzz run on MSVC needs the AddressSanitizer runtime DLL, so CI only builds here.
        # The fuzz-smoke job runs the targets on Linux.
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all features and targets)
        run: cargo clippy --all-features --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Clippy (no_std + alloc, all targets)
        run: cargo clippy --no-default-features --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features --target ${{ matrix.target }}

      - name: Test (no_std + alloc)
        run: cargo test --no-default-features --target ${{ matrix.target }}

      - name: Documentation (all features)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo doc --no-deps --all-features --target ${{ matrix.target }}

      - name: Documentation (no_std + alloc)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo doc --no-deps --no-default-features --target ${{ matrix.target }}

      - name: Verify release package
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo package

  no-std:
    name: no_std target (thumbv7em-none-eabi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Add Rust target
        run: rustup target add thumbv7em-none-eabi

      - name: Build (no_std + alloc, no standard library)
        run: cargo build --release --no-default-features --target thumbv7em-none-eabi

  fuzz-smoke:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run each fuzz target for a short time
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check semver against the published release
        uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-1.88-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv-1.88-cargo-

      - name: Check (all features and targets)
        run: cargo +1.88.0 check --all-features --all-targets

      - name: Check (no_std + alloc, all targets)
        run: cargo +1.88.0 check --no-default-features --all-targets

      - name: Test (all features)
        run: cargo +1.88.0 test --all-features

      - name: Test (no_std + alloc)
        run: cargo +1.88.0 test --no-default-features

      - name: Documentation (all features)
        run: cargo +1.88.0 doc --no-deps --all-features

      - name: Documentation (no_std + alloc)
        run: cargo +1.88.0 doc --no-deps --no-default-features
